<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 980" width="1920" height="980" font-family="Segoe UI,Arial,sans-serif"><rect width="1920" height="980" fill="#ffffff"/><rect x="0" y="0" width="1920" height="980" rx="0" fill="#1e1e1e" stroke="none" stroke-width="1.5"/><rect x="0" y="0" width="1920" height="60" rx="0" fill="#2d2d30" stroke="none" stroke-width="1.5"/><text x="30" y="40" font-size="24" fill="#ddd" font-weight="600" text-anchor="start">Vista de tabla · barra de fórmulas DAX</text><rect x="40" y="70" width="1840" height="100" rx="8" fill="#252526" stroke="#3c3c3c" stroke-width="1.5"/><text x="60" y="98" font-size="15" fill="#4ec9b0" font-weight="600" text-anchor="start">Medida</text><text x="60" y="140" font-size="28" fill="#9cdcfe" font-weight="700" text-anchor="start">Total_empleados =</text><text x="349" y="140" font-size="26" fill="#ce9178" font-weight="normal" text-anchor="start">DISTINCTCOUNT ( 'Tabla Empleados'[ID Empleado] )</text><rect x="40" y="190" width="1840" height="100" rx="8" fill="#252526" stroke="#3c3c3c" stroke-width="1.5"/><text x="60" y="218" font-size="15" fill="#4ec9b0" font-weight="600" text-anchor="start">Medida</text><text x="60" y="260" font-size="28" fill="#9cdcfe" font-weight="700" text-anchor="start">Evaluacion_promedio =</text><text x="417" y="260" font-size="26" fill="#ce9178" font-weight="normal" text-anchor="start">AVERAGE ( 'Tabla Evaluacion'[Evaluación] )</text><rect x="40" y="310" width="1840" height="100" rx="8" fill="#252526" stroke="#3c3c3c" stroke-width="1.5"/><text x="60" y="338" font-size="15" fill="#4ec9b0" font-weight="600" text-anchor="start">Medida</text><text x="60" y="380" font-size="28" fill="#9cdcfe" font-weight="700" text-anchor="start">Sueldo_promedio =</text><text x="349" y="380" font-size="26" fill="#ce9178" font-weight="normal" text-anchor="start">AVERAGE ( 'Tabla Sueldo'[Sueldo] )</text><rect x="40" y="430" width="1840" height="100" rx="8" fill="#252526" stroke="#3c3c3c" stroke-width="1.5"/><text x="60" y="458" font-size="15" fill="#4ec9b0" font-weight="600" text-anchor="start">Columna calculada</text><text x="60" y="500" font-size="28" fill="#9cdcfe" font-weight="700" text-anchor="start">Edad =</text><text x="162" y="500" font-size="26" fill="#ce9178" font-weight="normal" text-anchor="start">DATEDIFF ( 'Tabla Empleados'[Nacimiento], TODAY (), YEAR )</text><rect x="40" y="550" width="1840" height="100" rx="8" fill="#252526" stroke="#3c3c3c" stroke-width="1.5"/><text x="60" y="578" font-size="15" fill="#4ec9b0" font-weight="600" text-anchor="start">Columna calculada</text><text x="60" y="620" font-size="28" fill="#9cdcfe" font-weight="700" text-anchor="start">Grupo edad =</text><text x="264" y="620" font-size="26" fill="#ce9178" font-weight="normal" text-anchor="start">SWITCH ( TRUE (), [Edad] &lt; 30, "Menos de 30", [Edad] &lt; 40, "30 - 39", [Edad] &lt; 50, "40 - 49", "50 o más" )</text><rect x="40" y="670" width="1840" height="100" rx="8" fill="#252526" stroke="#3c3c3c" stroke-width="1.5"/><text x="60" y="698" font-size="15" fill="#4ec9b0" font-weight="600" text-anchor="start">Columna calculada</text><text x="60" y="740" font-size="28" fill="#9cdcfe" font-weight="700" text-anchor="start">Grupo_sueldo =</text><text x="298" y="740" font-size="26" fill="#ce9178" font-weight="normal" text-anchor="start">SWITCH ( TRUE (), [Sueldo] &lt; 50000, "Menos de 50 mil", ... , "Más de 110 mil" )</text><rect x="40" y="790" width="1840" height="100" rx="8" fill="#252526" stroke="#3c3c3c" stroke-width="1.5"/><text x="60" y="818" font-size="15" fill="#4ec9b0" font-weight="600" text-anchor="start">Columna calculada</text><text x="60" y="860" font-size="28" fill="#9cdcfe" font-weight="700" text-anchor="start">Grupo_evaluacion =</text><text x="366" y="860" font-size="26" fill="#ce9178" font-weight="normal" text-anchor="start">SWITCH ( TRUE (), [Evaluación] &lt; 6, "Bajo", [Evaluación] &lt; 8, "Medio", "Alto" )</text></svg>